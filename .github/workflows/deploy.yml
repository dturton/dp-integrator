name: Deploy

# Manual deploy of infra + function app to a target environment.
# Pre-reqs (one-time setup; see README "Deploying" section):
#   - Azure Entra app registration with federated credential for this repo+env
#   - GH Environment per target (dev, sandbox) with secrets:
#       AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#       POSTGRES_ADMIN_PASSWORD, KEY_VAULT_ADMIN_PRINCIPAL_ID
#       DPI_CONNECTIONS_JSON  (the connection registry — JSON array, NO raw secrets)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options: [dev, sandbox]
        default: dev
        required: true
      deploy_infra:
        description: 'Deploy Bicep infra (uncheck for app-code-only redeploy)'
        type: boolean
        default: true
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  # Serialize deploys per environment so two runs don't fight over the same resources.
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

# Opt every JS-based action into Node 24. GitHub forces this on 2026-06-02 and
# removes Node 20 from runners on 2026-09-16; explicit opt-in silences the
# deprecation warning and proves the workflow runs cleanly under Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install + build + test
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm --filter @dpi/admin-ui typecheck
          pnpm test
          pnpm build
          pnpm --filter @dpi/admin-ui build

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep infra
        if: ${{ github.event.inputs.deploy_infra == 'true' }}
        id: bicep
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          KV_ADMIN_PRINCIPAL_ID: ${{ secrets.KEY_VAULT_ADMIN_PRINCIPAL_ID }}
          BOOTSTRAP_CONNECTIONS_JSON: ${{ secrets.DPI_CONNECTIONS_JSON }}
        run: |
          set -euo pipefail
          # Preserve live operator edits to DPI_CONNECTIONS_JSON across infra
          # deploys: prefer the value already on the Function App, fall back
          # to the GitHub secret only when the live setting is empty (fresh
          # environment bootstrap). Without this, every infra-run would
          # overwrite operator changes (defaultDiscountItemId,
          # writeTagsOnImport, etc.) back to whatever the secret last had.
          RG="rg-dpi-${{ github.event.inputs.environment }}"
          EXISTING_FUNC_APP=$(az functionapp list --resource-group "$RG" --query '[0].name' -o tsv 2>/dev/null || true)
          LIVE_CONNECTIONS_JSON=""
          if [ -n "${EXISTING_FUNC_APP:-}" ]; then
            LIVE_CONNECTIONS_JSON=$(az functionapp config appsettings list \
              --name "$EXISTING_FUNC_APP" --resource-group "$RG" \
              --query "[?name=='DPI_CONNECTIONS_JSON'].value | [0]" -o tsv 2>/dev/null || true)
          fi
          if [ -n "${LIVE_CONNECTIONS_JSON:-}" ] && [ "$LIVE_CONNECTIONS_JSON" != "[]" ]; then
            CONNECTIONS_JSON="$LIVE_CONNECTIONS_JSON"
            echo "::notice::DPI_CONNECTIONS_JSON: using live value ($(echo "$CONNECTIONS_JSON" | jq 'length') connection[s])"
          else
            CONNECTIONS_JSON="$BOOTSTRAP_CONNECTIONS_JSON"
            echo "::notice::DPI_CONNECTIONS_JSON: bootstrapping from GH secret (no live value found)"
          fi
          DEPLOYMENT_NAME="dpi-${{ github.event.inputs.environment }}-$(date -u +%Y%m%d%H%M%S)"
          OUTPUTS=$(az deployment sub create \
            --name "$DEPLOYMENT_NAME" \
            --location eastus2 \
            --template-file infra/main.bicep \
            --parameters "infra/parameters/${{ github.event.inputs.environment }}.bicepparam" \
            --parameters postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
            --parameters keyVaultAdminPrincipalId="$KV_ADMIN_PRINCIPAL_ID" \
            --parameters connectionsJson="$CONNECTIONS_JSON" \
            --query properties.outputs \
            -o json)
          FUNCTION_APP=$(echo "$OUTPUTS" | jq -r '.functionAppName.value')
          WEBHOOK_URL=$(echo "$OUTPUTS" | jq -r '.webhookUrl.value')
          echo "deployment_name=$DEPLOYMENT_NAME" >> "$GITHUB_OUTPUT"
          echo "function_app=$FUNCTION_APP"     >> "$GITHUB_OUTPUT"
          echo "webhook_url=$WEBHOOK_URL"       >> "$GITHUB_OUTPUT"
          echo "::notice::Function App → $FUNCTION_APP"
          echo "::notice::Webhook URL  → $WEBHOOK_URL"

      - name: Resolve function app name (no infra deploy)
        if: ${{ github.event.inputs.deploy_infra != 'true' }}
        id: lookup
        run: |
          set -euo pipefail
          RG="rg-dpi-${{ github.event.inputs.environment }}"
          FUNCTION_APP=$(az functionapp list --resource-group "$RG" --query '[0].name' -o tsv)
          if [ -z "$FUNCTION_APP" ]; then
            echo "::error::No Function App found in resource group $RG"
            exit 1
          fi
          echo "function_app=$FUNCTION_APP" >> "$GITHUB_OUTPUT"

      - name: Package Function App
        env:
          # Set after either bicep deploy or lookup step ran.
          FUNCTION_APP: ${{ steps.bicep.outputs.function_app || steps.lookup.outputs.function_app }}
          # Force `pnpm deploy` to produce a HOISTED node_modules (flat layout) so
          # transitive Azure SDK deps (e.g. @azure/keyvault-common, pulled in by
          # @azure/keyvault-secrets) are resolvable from the top of node_modules at
          # runtime. The workspace default is `isolated` (symlinks into .pnpm/), which
          # zip flattens into orphaned copies that can't find their siblings — the
          # Functions host then logs ERR_MODULE_NOT_FOUND and "0 functions found".
          # Setting this only on the deploy step keeps the dev install symlinked.
          npm_config_node_linker: hoisted
        run: |
          set -euo pipefail
          rm -rf _pkg
          pnpm --filter @dpi/functions deploy --prod _pkg
          cp apps/functions/host.json _pkg/host.json
          (cd _pkg && zip -rq ../app-package.zip . -x "*.map" "src/*" "tsconfig*.json" "*.tsbuildinfo")
          ls -lh app-package.zip
          echo "Targeting Function App: $FUNCTION_APP"

      - name: Deploy Function App package
        uses: azure/functions-action@v1
        with:
          app-name: ${{ steps.bicep.outputs.function_app || steps.lookup.outputs.function_app }}
          package: app-package.zip
          sku: flexconsumption

      - name: Resolve admin UI SWA + link to function backend
        id: swa
        run: |
          set -euo pipefail
          RG="rg-dpi-${{ github.event.inputs.environment }}"
          SWA_NAME=$(az staticwebapp list --resource-group "$RG" --query '[0].name' -o tsv)
          if [ -z "$SWA_NAME" ]; then
            echo "::warning::No Static Web App found in $RG — skip admin-ui deploy. Run `make infra-deploy` to provision."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SWA_HOST=$(az staticwebapp show --name "$SWA_NAME" --resource-group "$RG" --query defaultHostname -o tsv)
          # Idempotent: linking an already-linked backend is a no-op except for
          # the env arg, which the API also tolerates. Surfaces /api/* from the
          # linked function app to the SWA's domain.
          FUNCTION_APP="${{ steps.bicep.outputs.function_app || steps.lookup.outputs.function_app }}"
          FUNCTION_APP_ID=$(az functionapp show --name "$FUNCTION_APP" --resource-group "$RG" --query id -o tsv)
          az staticwebapp backends link \
            --name "$SWA_NAME" --resource-group "$RG" \
            --backend-resource-id "$FUNCTION_APP_ID" \
            --backend-region eastus2 \
            2>/dev/null || echo "::notice::backend link already in place (or replaced)"
          DEPLOY_TOKEN=$(az staticwebapp secrets list --name "$SWA_NAME" --resource-group "$RG" --query properties.apiKey -o tsv)
          echo "swa_name=$SWA_NAME"  >> "$GITHUB_OUTPUT"
          echo "swa_host=$SWA_HOST"  >> "$GITHUB_OUTPUT"
          echo "deploy_token=$DEPLOY_TOKEN" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$DEPLOY_TOKEN"
          echo "::notice::Admin UI → https://$SWA_HOST"

      - name: Deploy admin UI to Static Web Apps
        if: ${{ steps.swa.outputs.skip != 'true' }}
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.deploy_token }}
          action: upload
          app_location: 'apps/admin-ui/dist'
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true

      - name: Summary
        run: |
          {
            echo "### Deploy complete"
            echo ""
            echo "- Environment: \`${{ github.event.inputs.environment }}\`"
            echo "- Function App: \`${{ steps.bicep.outputs.function_app || steps.lookup.outputs.function_app }}\`"
            if [ -n "${{ steps.bicep.outputs.webhook_url || '' }}" ]; then
              echo "- Webhook URL: ${{ steps.bicep.outputs.webhook_url }}"
            fi
            if [ -n "${{ steps.swa.outputs.swa_host || '' }}" ]; then
              echo "- Admin UI: https://${{ steps.swa.outputs.swa_host }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
